<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <title>Update Category</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.14.0/css/all.css">
  <link rel="stylesheet" th:href="@{/css/theme.css}">
  <style>
    :root { --primary-color: #4e73df; --secondary-color: #f8f9fc; --text-color: #5a5c69; }
    body { background-color: var(--secondary-color); color: var(--text-color); }
    .card { border: none; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    .card-header { background-color: var(--primary-color); color: #fff; }
    .btn-primary { background-color: var(--primary-color); border-color: var(--primary-color); }
    .form-control:focus { border-color: var(--primary-color); box-shadow: 0 0 0 0.2rem rgba(78,115,223,0.25); }
  </style>
</head>
<body>
  <div th:insert="comman/header :: header"></div>
  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-lg-6">
        <div class="card">
          <div class="card-header"><h4><i class="fas fa-list-alt mr-2"></i>Update Category</h4></div>
          <div class="card-body">
            <form th:action="@{/update-category/{id}(id=${category.id})}" th:object="${category}" method="post" novalidate>
              <div class="form-group">
                <label for="name">Category Name</label>
                <input type="text" th:field="*{name}" class="form-control" id="name" placeholder="Category Name">
                <div class="invalid-feedback"></div>
              </div>
              <button type="submit" class="btn btn-primary btn-block"><i class="fas fa-save mr-1"></i>Update</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>
  <div th:insert="comman/footer :: footer"></div>
</body>
</html>
