<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.14.0/css/all.css">
  <!-- Custom Theme -->
  <link rel="stylesheet" th:href="@{/css/theme.css}">
  <style>
    :root {
      --primary-color: #4e73df;
      --secondary-color: #f8f9fc;
      --text-color: #5a5c69;
      --card-bg: #ffffff;
    }
    body {
      background-color: var(--secondary-color);
      color: var(--text-color);
    }
    main.login-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 112px); /* adjust for header/footer height */
      padding: 2rem 0;
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      background-color: var(--card-bg);
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      border: none;
      border-radius: 0.5rem;
    }
    .login-card .card-header {
      background-color: var(--primary-color);
      color: #fff;
      text-align: center;
      font-size: 1.25rem;
    }
    .login-card .btn-primary {
      background-color: var(--primary-color);
      border-color: var(--primary-color);
    }
    .login-card .form-control:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 0.2rem rgba(78,115,223,0.25);
    }
  </style>
</head>

<body>
  <!-- Header -->
  <div th:insert="comman/header :: header"></div>
  <!-- Login Form -->
  <main class="container login-wrapper">
    <div class="card login-card">
      <div class="card-header">
        <i class="fas fa-user-lock mr-2"></i>Admin Login
      </div>
      <div class="card-body">
        <form th:action="@{/login}" method="post">
          <div th:if="${param.error}" class="alert alert-danger">
            Invalid username or password.
          </div>
          <div th:if="${param.logout}" class="alert alert-info">
            You have been logged out.
          </div>
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" class="form-control" id="username" name="username" placeholder="Enter Email ID" autofocus>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Enter Password">
          </div>
          <button type="submit" class="btn btn-primary btn-block">Log In</button>
        </form>
      </div>
    </div>
  </main>
  <!-- Footer -->
  <div th:insert="comman/footer :: footer"></div>
  <!-- JS -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
