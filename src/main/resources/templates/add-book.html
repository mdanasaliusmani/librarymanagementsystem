<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <title>Add Book</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.14.0/css/all.css">
  <!-- Custom Theme -->
  <link rel="stylesheet" th:href="@{/css/theme.css}">
  <style>
    :root {
      --primary-color: #4e73df;
      --secondary-color: #f8f9fc;
      --text-color: #5a5c69;
    }
    body {
      background-color: var(--secondary-color);
      color: var(--text-color);
      /* Removed top padding to eliminate unnecessary margin above header */
    }
    .card {
      border: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .card-header {
      background-color: var(--primary-color);
      color: #fff;
    }
    .btn-primary {
      background-color: var(--primary-color);
      border-color: var(--primary-color);
    }
  </style>
  <script>
    function validateForm() {
      var isValid = true;
      document.querySelectorAll('.form-control').forEach(function (input) {
        var feedback = input.nextElementSibling;
        if (input.value.trim() === '') {
          isValid = false;
          input.classList.add('is-invalid');
          feedback.textContent = 'This field is required.';
        } else {
          input.classList.remove('is-invalid');
          feedback.textContent = '';
        }
      });
      return isValid;
    }
  </script>
</head>

<body>
  <div th:insert="comman/header :: header"></div>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card">
          <div class="card-header">
            <h4 class="mb-0"><i class="fas fa-book-medical mr-2"></i>Add Book</h4>
          </div>
          <div class="card-body">
            <form th:action="@{/add-book}" th:object="${book}" method="post" onsubmit="return validateForm()" novalidate>
              <div class="form-row">
                <div class="form-group col-md-6">
                  <label for="isbn">ISBN</label>
                  <input type="text" th:field="*{isbn}" class="form-control" id="isbn" placeholder="ISBN">
                  <div class="invalid-feedback"></div>
                </div>
                <div class="form-group col-md-6">
                  <label for="name">Book Name</label>
                  <input type="text" th:field="*{name}" class="form-control" id="name" placeholder="Book Name">
                  <div class="invalid-feedback"></div>
                </div>
              </div>
              <div class="form-group">
                <label for="serialName">Serial Name</label>
                <input type="text" th:field="*{serialName}" class="form-control" id="serialName" placeholder="Serial Name">
                <div class="invalid-feedback"></div>
              </div>
              <div class="form-group">
                <label for="description">Description</label>
                <textarea th:field="*{description}" class="form-control" id="description" rows="3" placeholder="Description"></textarea>
                <div class="invalid-feedback"></div>
              </div>
              <div class="form-row">
                <div class="form-group col-md-4">
                  <label for="category">Category</label>
                  <select th:field="*{categories}" class="form-control" id="category">
                    <option th:each="category: ${categories}" th:value="${category.id}" th:text="${category.name}"></option>
                  </select>
                  <div class="invalid-feedback"></div>
                </div>
                <div class="form-group col-md-4">
                  <label for="author">Author</label>
                  <select th:field="*{authors}" class="form-control" id="author">
                    <option th:each="author: ${authors}" th:value="${author.id}" th:text="${author.name}"></option>
                  </select>
                  <div class="invalid-feedback"></div>
                </div>
                <div class="form-group col-md-4">
                  <label for="publisher">Publisher</label>
                  <select th:field="*{publishers}" class="form-control" id="publisher">
                    <option th:each="publisher: ${publishers}" th:value="${publisher.id}" th:text="${publisher.name}"></option>
                  </select>
                  <div class="invalid-feedback"></div>
                </div>
              </div>
              <button type="submit" class="btn btn-primary"><i class="fas fa-save mr-1"></i>Submit</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div th:insert="comman/footer :: footer"></div>

  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
