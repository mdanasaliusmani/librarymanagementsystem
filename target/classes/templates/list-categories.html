<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <title>All Categories</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.14.0/css/all.css">
  <!-- Custom Theme -->
  <link rel="stylesheet" th:href="@{/css/theme.css}">
  <style>
    :root {
      --primary-color: #4e73df;
      --secondary-color: #f8f9fc;
      --text-color: #5a5c69;
      --hover-color: rgba(78, 115, 223, 0.1);
    }
    body {
      background-color: var(--secondary-color);
      color: var(--text-color);
    }
    .table-card {
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      border: none;
    }
    .table-card .card-header {
      background-color: var(--primary-color);
      color: #fff;
    }
    /* Zebra striping */
    .table-striped tbody tr:nth-of-type(odd) {
      background-color: #fff;
    }
    .table-striped tbody tr:nth-of-type(even) {
      background-color: var(--secondary-color);
    }
    /* Hover effect matching other lists */
    .table-hover tbody tr:hover {
      background-color: var(--hover-color) !important;
    }
    .btn-add, .btn-export {
      margin-right: 0.5rem;
    }
    .pagination a {
      margin: 0 0.25rem;
      padding: 0.5rem 0.75rem;
      color: var(--primary-color);
      border: 1px solid var(--primary-color);
      border-radius: 0.25rem;
      text-decoration: none;
    }
    .pagination a.active {
      background-color: var(--primary-color);
      color: #fff;
    }
  </style>
</head>

<body>
  <div th:insert="comman/header :: header"></div>
  
  <main class="container my-5">
    <div class="card table-card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h4 class="mb-0"><i class="fas fa-list-alt mr-2"></i>All Categories</h4>
        <div>
          <a th:href="@{/addCategory}" class="btn btn-primary btn-add"><i class="fas fa-plus-circle mr-1"></i>Add Category</a>
          <a th:href="@{/export/all-category}" class="btn btn-info btn-export"><i class="fas fa-file-csv mr-1"></i>Export CSV</a>
        </div>
      </div>
      <div class="card-body">
        <div th:switch="${categories}">
          <h5 th:case="null" class="text-center py-4">No record found!</h5>
          <div th:case="*">
            <div class="table-responsive">
              <table class="table table-hover table-striped">
                <thead>
                  <tr>
                    <th>Category Name</th>
                    <th class="text-center">Edit</th>
                    <th class="text-center">Delete</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="category : ${categories}">
                    <td th:text="${category.name}"></td>
                    <td class="text-center">
                      <a th:href="@{/updateCategory/{id}(id=${category.id})}" class="btn btn-sm btn-warning"><i class="fas fa-edit"></i></a>
                    </td>
                    <td class="text-center">
                      <a th:href="@{/remove-category/{id}(id=${category.id})}" class="btn btn-sm btn-danger"><i class="fas fa-trash-alt"></i></a>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
  
  <div th:insert="comman/footer :: footer"></div>
  
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
