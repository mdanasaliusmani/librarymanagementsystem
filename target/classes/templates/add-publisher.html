<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <title>Add Publisher</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.14.0/css/all.css">
  <!-- Custom Theme -->
  <link rel="stylesheet" th:href="@{/css/theme.css}">
  <style>
    :root {
      --primary-color: #4e73df;
      --secondary-color: #f8f9fc;
      --text-color: #5a5c69;
    }
    body {
      background-color: var(--secondary-color);
      color: var(--text-color);
    }
    .card {
      border: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .card-header {
      background-color: var(--primary-color);
      color: #fff;
    }
    .btn-primary {
      background-color: var(--primary-color);
      border-color: var(--primary-color);
    }
  </style>
  <script>
    function validateForm() {
      var isValid = true;
      document.querySelectorAll('.form-control').forEach(function (input) {
        var feedback = input.nextElementSibling;
        if (input.value.trim() === '') {
          isValid = false;
          input.classList.add('is-invalid');
          feedback.textContent = 'This field is required.';
        } else {
          input.classList.remove('is-invalid');
          feedback.textContent = '';
        }
      });
      return isValid;
    }
  </script>
</head>

<body>
  <!-- Header -->
  <div th:insert="comman/header :: header"></div>

  <!-- Main Content -->
  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-lg-6">
        <div class="card">
          <div class="card-header">
            <h4 class="mb-0"><i class="fas fa-building mr-2"></i>Add Publisher</h4>
          </div>
          <div class="card-body">
            <form th:action="@{/add-publisher}" th:object="${publisher}" method="post" onsubmit="return validateForm()" novalidate>
              <div class="form-group">
                <label for="name">Publisher Name</label>
                <input type="text" th:field="*{name}" class="form-control" id="name" placeholder="Enter publisher name">
                <div class="invalid-feedback"></div>
              </div>
              <button type="submit" class="btn btn-primary btn-block"><i class="fas fa-plus-circle mr-1"></i>Submit</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <div th:insert="comman/footer :: footer"></div>

  <!-- Bootstrap JS -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
