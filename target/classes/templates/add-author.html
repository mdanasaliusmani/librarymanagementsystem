<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>Add Author</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.14.0/css/all.css">
    <!-- Custom Theme Styles -->
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <style>
      /* Fallback in case custom CSS is not loaded immediately */
      :root {
        --primary-color: #4e73df;
        --secondary-color: #f8f9fc;
        --text-color: #5a5c69;
      }
      body {
        background-color: var(--secondary-color);
        color: var(--text-color);
      }
      .card-header {
        background-color: var(--primary-color);
        color: #fff;
      }
      .btn-primary {
        background-color: var(--primary-color);
        border-color: var(--primary-color);
      }
    </style>
    <script>
        function validateForm() {
            var isValid = true;
            document.querySelectorAll('.form-control').forEach(function (input) {
                var feedback = input.nextElementSibling;
                if (input.value.trim() === '') {
                    isValid = false;
                    input.classList.add('is-invalid');
                    feedback.textContent = 'This field is required.';
                } else {
                    input.classList.remove('is-invalid');
                    feedback.textContent = '';
                }
            });
            return isValid;
        }
    </script>
</head>

<body>
  <!-- Header -->
  <div th:insert="comman/header :: header"></div>

  <!-- Main Content -->
  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-lg-6">
        <div class="card shadow-sm border-0">
          <div class="card-header">
            <h4 class="mb-0"><i class="fas fa-user-plus mr-2"></i>Add Author</h4>
          </div>
          <div class="card-body">
            <form th:action="@{/add-author}" th:object="${author}" method="post" onsubmit="return validateForm()" novalidate>
              <div class="form-group">
                <label for="name">Author Name</label>
                <input type="text" th:field="*{name}" class="form-control" id="name" placeholder="Enter author name">
                <div class="invalid-feedback"></div>
              </div>

              <div class="form-group">
                <label for="description">Description</label>
                <textarea th:field="*{description}" class="form-control" id="description" rows="3" placeholder="Short bio or description"></textarea>
                <div class="invalid-feedback"></div>
              </div>

              <button type="submit" class="btn btn-primary btn-block"><i class="fas fa-check-circle mr-1"></i>Submit</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <div th:insert="comman/footer :: footer"></div>

  <!-- Bootstrap JS -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
