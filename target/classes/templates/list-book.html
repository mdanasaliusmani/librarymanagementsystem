<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <title>All Books</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.14.0/css/all.css">
  <!-- Custom Theme -->
  <link rel="stylesheet" th:href="@{/css/theme.css}">
  <style>
    :root {
      --primary-color: #4e73df;
      --secondary-color: #f8f9fc;
      --text-color: #5a5c69;
    }
    body {
      background-color: var(--secondary-color);
      color: var(--text-color);
    }
    .table-card {
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      border: none;
    }
    .table-card .card-header {
      background-color: var(--primary-color);
      color: #fff;
    }
    .btn-add-book, .btn-export-books {
      margin-right: 0.5rem;
    }
    .pagination a {
      margin: 0 0.25rem;
      padding: 0.5rem 0.75rem;
      color: var(--primary-color);
      border: 1px solid var(--primary-color);
      border-radius: 0.25rem;
      text-decoration: none;
    }
    .pagination a.active {
      background-color: var(--primary-color);
      color: #fff;
    }
  </style>
</head>

<body>
  <!-- Header -->
  <div th:insert="comman/header :: header"></div>

  <!-- Main Content -->
  <main class="container my-5">
    <div class="card table-card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h4 class="mb-0"><i class="fas fa-book mr-2"></i>All Books</h4>
        <div>
          <a th:href="@{/add-book}" class="btn btn-primary btn-add-book"><i class="fas fa-plus-circle mr-1"></i>Add Book</a>
          <a th:href="@{/export/all-books}" class="btn btn-info btn-export-books"><i class="fas fa-file-csv mr-1"></i>Export CSV</a>
        </div>
      </div>
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-hover table-striped">
            <thead>
              <tr>
                <th>ISBN</th>
                <th>Category</th>
                <th>Name</th>
                <th>Author</th>
                <th>Publisher</th>
                <th>Serial</th>
                <th>Description</th>
                <th class="text-center">Edit</th>
                <th class="text-center">Delete</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="book : ${books}">
                <td th:text="${book.isbn}"></td>
                <td th:text="${book.categories[0].name}"></td>
                <td th:text="${book.name}"></td>
                <td th:text="${book.authors[0].name}"></td>
                <td th:text="${book.publishers[0].name}"></td>
                <td th:text="${book.serialName}"></td>
                <td th:text="${book.description}"></td>
                <td class="text-center">
                  <a th:href="@{/update-book/{id}(id=${book.id})}" class="btn btn-sm btn-warning"><i class="fas fa-edit"></i></a>
                </td>
                <td class="text-center">
                  <a th:href="@{/remove-book/{id}(id=${book.id})}" class="btn btn-sm btn-danger"><i class="fas fa-trash-alt"></i></a>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <!-- Pagination -->
        <nav aria-label="Page navigation">
          <ul class="pagination justify-content-center mt-4">
            <li class="page-item" th:each="pageNum : ${pageNumbers}" th:classappend="${pageNum == books.number+1} ? 'active'">
              <a class="page-link" th:href="@{/books(size=${books.size}, page=${pageNum})}" th:text="${pageNum}"></a>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <div th:insert="comman/footer :: footer"></div>

  <!-- Bootstrap JS -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
